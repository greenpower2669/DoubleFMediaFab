name: Android APK – Double F Media Fab
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Use preinstalled Android SDK on GitHub runner
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "Installed platforms:"
          ls -1 "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Compile Android debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify and name direct APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/DoubleFMediaFab-v0.2.0-debug.apk
          sha256sum release/*.apk | tee release/SHA256SUMS.txt
      - name: Retain internal build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: DoubleFMediaFab-internal-build
          path: |
            release/DoubleFMediaFab-v0.2.0-debug.apk
            release/SHA256SUMS.txt
      - name: Publish installable APK directly in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-alpha1
          name: Double F Media Fab v0.2.0 alpha 1
          prerelease: true
          make_latest: false
          body: |
            Lecteur immersif avec glissement, zoom tactile, transitions animées, playlist et commandes au double-tap. Analyse des doublons, ML Kit local et corbeille avec confirmation Android.
            APK de test signée avec la clé debug GitHub Actions. Signature non destinée à des mises à jour stables.
            Le contrôle SHA-256 est fourni ci-joint.
          files: |
            release/DoubleFMediaFab-v0.2.0-debug.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
